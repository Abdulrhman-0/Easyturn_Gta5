; EasyTurn Custom Mods List
; Add your custom .dll or .asi filenames here
; One filename per line
; Example:
; MyCoolMod.asi
; SomeOtherTool.dll
;
; NOTE: These mods are monitored and appear in the mod grid.
; They get ENABLED when Online Ready is toggled ON.
;
; For DLLs that should be DISABLED when going online (e.g., xinput1_4.dll),
; use the "Online Mode Exclusions" check list in the app's Settings panel.
; Those exclusions are stored separately in settings.json.
;
; To turn a mod off PERMANENTLY, tick it under "Banned Mods" in the Settings
; panel. Banned mods are switched off for good and never come back through the
; main screen's Mods toggle. They are also stored in settings.json.
;
; NOTE: the files GTA 5 itself uses (GTA5.exe, common.rpf, bink2w64.dll, ...)
; are never listed and can never be turned off. The full vanilla file name list
; lives in VanillaFiles.cs.
