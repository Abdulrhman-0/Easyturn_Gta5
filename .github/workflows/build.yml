name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build EasyTurn.csproj -c Release

      - name: Publish
        run: dotnet publish EasyTurn.csproj -c Release -o publish

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: EasyTurn
          path: publish/
